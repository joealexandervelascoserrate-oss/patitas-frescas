<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -26 300 326" width="300" height="326">
  <!-- Mark, border collie de Patitas Frescas (estilo cartoon) -->
  <defs>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#b8763a"/>
      <stop offset=".65" stop-color="#7a4a24"/>
      <stop offset="1" stop-color="#4f2c12"/>
    </radialGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd05f"/>
      <stop offset="1" stop-color="#76ad3c"/>
    </linearGradient>
  </defs>
  <style>
    * { transform-box: view-box; }
    .salto { animation: salto .62s ease-in-out infinite; transform-origin: 150px 285px; }
    .sombra { animation: sombra .62s ease-in-out infinite; transform-origin: 150px 286px; }
    .cabeza { animation: ladeo 2.6s ease-in-out infinite; transform-origin: 150px 180px; }
    .cola { animation: cola .22s ease-in-out infinite alternate; transform-origin: 196px 224px; }
    .oreja-d { animation: oreja 1.3s ease-in-out infinite; transform-origin: 198px 60px; }
    .oreja-i { animation: oreja-i 2.6s ease-in-out infinite; transform-origin: 100px 62px; }
    .ojos { animation: parpadeo 3.8s infinite; transform-origin: 150px 102px; }
    .cejas { animation: cejas 2.6s ease-in-out infinite; }
    .lengua { animation: lengua .31s ease-in-out infinite alternate; transform-origin: 150px 162px; }
    .placa { animation: placa .62s ease-in-out infinite; transform-origin: 150px 196px; }
    @keyframes salto { 0%,100% { transform: translateY(0) scale(1.05,.95); } 45% { transform: translateY(-20px) scale(.97,1.04); } }
    @keyframes sombra { 0%,100% { transform: scale(1); opacity: .22; } 45% { transform: scale(.72); opacity: .1; } }
    @keyframes ladeo { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes cola { from { transform: rotate(-22deg); } to { transform: rotate(26deg); } }
    @keyframes oreja { 0%,100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
    @keyframes oreja-i { 0%,80%,100% { transform: rotate(0); } 88% { transform: rotate(-9deg); } }
    @keyframes parpadeo { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes cejas { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes lengua { from { transform: scaleY(1); } to { transform: scaleY(1.12); } }
    @keyframes placa { 0%,100% { transform: rotate(-10deg); } 45% { transform: rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse class="sombra" cx="150" cy="287" rx="78" ry="9" fill="#1e2320" opacity=".22"/>

  <g class="salto" stroke="#1e2320" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- Cola peluda con punta blanca -->
    <g class="cola">
      <path d="M220 212 L 247 216 L 230 197 Z" fill="#22262a"/>
      <path d="M236 186 L 263 184 L 242 169 Z" fill="#22262a"/>
      <path d="M196 224 C 232 216, 248 182, 240 142" fill="none" stroke="#1e2320" stroke-width="28"/>
      <path d="M196 224 C 232 216, 248 182, 240 142" fill="none" stroke="#22262a" stroke-width="18"/>
      <path d="M200 216 C 222 210, 234 192, 236 176" fill="none" stroke="#4a5158" stroke-width="3.5"/>
      <g stroke="none" fill="#1e2320">
        <circle cx="240" cy="134" r="18"/><circle cx="251" cy="142" r="13"/><circle cx="230" cy="127" r="13"/><circle cx="244" cy="121" r="11"/>
      </g>
      <g stroke="none" fill="#fff">
        <circle cx="240" cy="134" r="13"/><circle cx="251" cy="142" r="8"/><circle cx="230" cy="127" r="8"/><circle cx="244" cy="121" r="6.5"/>
      </g>
    </g>

    <!-- Patas traseras -->
    <ellipse cx="103" cy="250" rx="27" ry="25" fill="#22262a"/>
    <ellipse cx="197" cy="250" rx="27" ry="25" fill="#22262a"/>
    <ellipse cx="90" cy="277" rx="19" ry="9" fill="#fff"/>
    <ellipse cx="210" cy="277" rx="19" ry="9" fill="#fff"/>

    <!-- Cuerpo -->
    <ellipse cx="150" cy="230" rx="58" ry="44" fill="#22262a"/>
    <path d="M106 210 Q 101 226 108 244" fill="none" stroke="#4a5158" stroke-width="4"/>

    <!-- Pechera blanca con mechones -->
    <path d="M116 196 C 124 184, 176 184, 184 196 C 190 214, 186 232, 177 244 L 168 238 L 162 251 L 154 242 L 146 253 L 139 242 L 132 251 L 127 238 L 120 244 C 112 230, 110 212, 116 196 Z" fill="#fff"/>
    <path d="M134 226 l6 8 M160 226 l-6 8 M148 214 v8" fill="none" stroke="#c9d3da" stroke-width="3"/>

    <!-- Patas delanteras -->
    <rect x="115" y="238" width="25" height="40" rx="12" fill="#fff"/>
    <rect x="160" y="238" width="25" height="40" rx="12" fill="#fff"/>
    <ellipse cx="126" cy="277" rx="23" ry="11" fill="#fff"/>
    <ellipse cx="174" cy="277" rx="23" ry="11" fill="#fff"/>
    <path d="M117 276 v6 M126 277 v7 M135 276 v6 M165 276 v6 M174 277 v7 M183 276 v6" stroke-width="3"/>
    <path d="M120 250 v16 M165 250 v16" stroke="#dfe6eb" stroke-width="4"/>

    <!-- Collar y placa -->
    <path d="M102 180 Q 150 206 198 180 L 200 194 Q 150 222 100 194 Z" fill="url(#collar)"/>
    <circle cx="116" cy="193" r="2.6" fill="#ffd84a" stroke-width="1.5"/>
    <circle cx="184" cy="193" r="2.6" fill="#ffd84a" stroke-width="1.5"/>
    <g class="placa">
      <path d="M150 204 v4" stroke-width="3"/>
      <circle cx="150" cy="217" r="12" fill="#ffd84a" stroke-width="4"/>
      <path d="M144.5 221.5 v-9 l5.5 6 l5.5 -6 v9" fill="none" stroke-width="2.6"/>
      <circle cx="146" cy="212" r="2.2" fill="#fff6c9" stroke="none"/>
    </g>

    <!-- Cabeza -->
    <g class="cabeza">
      <!-- mechones detrás de la cabeza -->
      <path d="M72 116 L 50 126 L 69 133 L 52 146 L 75 146 L 64 162 L 90 152 Z" fill="#22262a"/>
      <path d="M228 116 L 250 126 L 231 133 L 248 146 L 225 146 L 236 162 L 210 152 Z" fill="#22262a"/>
      <path d="M132 44 L 138 24 L 147 38 L 154 18 L 161 38 L 170 26 L 170 46 Z" fill="#22262a"/>

      <!-- oreja izquierda (parada) -->
      <g class="oreja-i">
        <path d="M88 72 L 64 6 L 124 44 Z" fill="#22262a"/>
        <path d="M91 60 L 75 22 L 112 46 Z" fill="#f4a3b4" stroke-width="3"/>
        <path d="M86 50 l9 -4 M82 40 l8 -3 M90 58 l8 -5" fill="none" stroke="#fff" stroke-width="2.5"/>
      </g>
      <!-- oreja derecha (semi caída) -->
      <g class="oreja-d">
        <path d="M180 46 L 240 18 L 216 76 Z" fill="#22262a"/>
        <path d="M194 52 L 226 34 L 212 64 Z" fill="#f4a3b4" stroke-width="3"/>
        <path d="M240 18 L 257 50 L 224 47 Z" fill="#30363b"/>
        <path d="M232 26 L 246 44" fill="none" stroke="#4a5158" stroke-width="3"/>
      </g>

      <ellipse cx="150" cy="112" rx="84" ry="76" fill="#22262a"/>
      <path d="M84 88 Q 92 62 116 48" fill="none" stroke="#4a5158" stroke-width="5"/>

      <!-- hocico blanco y franja -->
      <ellipse cx="150" cy="150" rx="55" ry="37" fill="#fff"/>
      <path d="M150 44 C 141 68, 134 90, 127 124 L 173 124 C 166 90, 159 68, 150 44Z" fill="#fff" stroke="none"/>
      <ellipse cx="150" cy="166" rx="38" ry="12" fill="#e9eef2" stroke="none"/>
      <g fill="#8d969c" stroke="none">
        <circle cx="117" cy="146" r="2.3"/><circle cx="124" cy="155" r="2.3"/><circle cx="112" cy="157" r="2.3"/>
        <circle cx="183" cy="146" r="2.3"/><circle cx="176" cy="155" r="2.3"/><circle cx="188" cy="157" r="2.3"/>
      </g>
      <ellipse cx="104" cy="151" rx="10" ry="6" fill="#f4a3b4" opacity=".85" stroke="none"/>
      <ellipse cx="196" cy="151" rx="10" ry="6" fill="#f4a3b4" opacity=".85" stroke="none"/>

      <!-- ojos -->
      <g class="ojos">
        <ellipse cx="114" cy="102" rx="24" ry="28" fill="#fff"/>
        <ellipse cx="186" cy="102" rx="24" ry="28" fill="#fff"/>
        <circle cx="118" cy="106" r="16" fill="url(#iris)" stroke-width="2.5"/>
        <circle cx="182" cy="106" r="16" fill="url(#iris)" stroke-width="2.5"/>
        <circle cx="119" cy="107" r="8.5" fill="#1e2320" stroke="none"/>
        <circle cx="181" cy="107" r="8.5" fill="#1e2320" stroke="none"/>
        <circle cx="124.5" cy="99" r="5.5" fill="#fff" stroke="none"/>
        <circle cx="187.5" cy="99" r="5.5" fill="#fff" stroke="none"/>
        <circle cx="112" cy="113" r="2.5" fill="#fff" stroke="none"/>
        <circle cx="175" cy="113" r="2.5" fill="#fff" stroke="none"/>
      </g>

      <!-- cejas peluditas -->
      <g class="cejas" fill="none" stroke="#fff" stroke-width="6">
        <path d="M92 68 Q 104 56 120 62 Q 126 64 129 68"/>
        <path d="M208 68 Q 196 56 180 62 Q 174 64 171 68"/>
      </g>

      <!-- nariz -->
      <path d="M135 134 C 135 125, 165 125, 165 134 C 165 142, 155 147, 150 147 C 145 147, 135 142, 135 134 Z" fill="#1e2320"/>
      <ellipse cx="143" cy="131" rx="5.5" ry="2.6" fill="#fff" stroke="none" opacity=".9"/>

      <!-- boca y lengua -->
      <path d="M150 147 v8 M119 151 Q 134 172 150 158 Q 166 172 181 151" fill="none"/>
      <g class="lengua">
        <path d="M140 162 Q 138 197 150 197 Q 162 197 160 162 Z" fill="#ff7a8f"/>
        <path d="M150 168 v18" fill="none" stroke="#e85d75" stroke-width="2.5"/>
        <ellipse cx="144" cy="176" rx="2.5" ry="5" fill="#ffb3c0" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
